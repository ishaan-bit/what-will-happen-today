name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is not set" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8')); console.log('google-services.json valid JSON')"
          # EAS local build creates the source tarball from the git index, so
          # gitignored files are excluded. Force-add and create an ephemeral
          # local commit so the file is included in the tarball. This commit
          # is never pushed (the runner is ephemeral).
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git add --force google-services.json
          git commit -m "ci: temp google-services.json for EAS build" --no-verify

      - name: Build AAB (production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CREDENTIALS_CHECK: "1"
        run: eas build --platform android --profile production --local --non-interactive --output ./build.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: wwht-production-aab
          path: build.aab
          retention-days: 30
