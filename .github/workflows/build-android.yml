name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run hero shuffle tests
        run: npm run test:hero-shuffle

      - name: Run pricing guardrail test (₹29 daily / ₹49 30-day)
        run: npm run test:pricing

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is not set" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8')); console.log('google-services.json valid JSON')"
          # EAS local build packages the source by applying .gitignore rules.
          # When .easignore exists it overrides .gitignore for packaging.
          # Mirror .gitignore but drop the google-services.json line so the
          # file is included in the source tarball.
          grep -v -E '^google-services\.json$' .gitignore > .easignore
          echo "--- .easignore ---"; cat .easignore
          echo "--- ls google-services.json ---"; ls -la google-services.json

      - name: Validate production ad env
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_SIGNAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_SIGNAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_DEEPER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_DEEPER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_REWARDED_HERO_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_TEST_MODE: "false"
          EXPO_PUBLIC_REWARDED_AD_MOCK: "false"
        run: |
          missing=0
          for key in EXPO_TOKEN EXPO_PUBLIC_ADMOB_ANDROID_APP_ID EXPO_PUBLIC_ADMOB_REWARDED_SIGNAL_UNIT_ID EXPO_PUBLIC_ADMOB_REWARDED_DEEPER_UNIT_ID EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID; do
            if [ -z "${!key}" ]; then
              echo "ERROR: $key is not set" >&2
              missing=1
            fi
          done
          if [ -z "$EXPO_PUBLIC_ADMOB_ANDROID_REWARDED_HERO_UNIT_ID" ]; then
            echo "ERROR: EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID secret is not set for Android hero rewarded ads" >&2
            missing=1
          fi
          if [ "$EXPO_PUBLIC_ADMOB_TEST_MODE" != "false" ]; then
            echo "ERROR: EXPO_PUBLIC_ADMOB_TEST_MODE must be false for production" >&2
            missing=1
          fi
          if [ "$EXPO_PUBLIC_REWARDED_AD_MOCK" != "false" ]; then
            echo "ERROR: EXPO_PUBLIC_REWARDED_AD_MOCK must be false for production" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          hero_suffix="${EXPO_PUBLIC_ADMOB_ANDROID_REWARDED_HERO_UNIT_ID##*/}"
          echo "Android hero rewarded unit suffix: $hero_suffix"
          if [ "$hero_suffix" != "9004079434" ]; then
            echo "ERROR: Android hero rewarded unit suffix must be 9004079434" >&2
            exit 1
          fi
          test_unit="ca-app-pub-3940256099942544/5224354917"
          test_suffix="${test_unit##*/}"
          if [ "$test_suffix" != "5224354917" ]; then
            echo "ERROR: Forced hero test rewarded unit suffix must resolve to 5224354917" >&2
            exit 1
          fi
          npx expo config --type public --json >/tmp/expo-public-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/expo-public-config.json', 'utf8').replace(/^\uFEFF/, ''));
          if (!config.version || !config.android || !config.android.versionCode) {
            console.error('ERROR: Expo public config did not resolve version/versionCode during Android build validation');
            process.exit(1);
          }
          console.log(`Expo public config resolved: version=${config.version} versionCode=${config.android.versionCode}`);
          NODE

      - name: Build AAB (production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CREDENTIALS_CHECK: "1"
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_SIGNAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_SIGNAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_DEEPER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_DEEPER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_REWARDED_HERO_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_HERO_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_TEST_MODE: "false"
          EXPO_PUBLIC_REWARDED_AD_MOCK: "false"
        run: eas build --platform android --profile production --local --non-interactive --output ./build.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: wwht-production-aab
          path: build.aab
          retention-days: 30
