name: Build Preview AAB

on:
  push:
    branches: [feature/**]
  workflow_dispatch:

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build AAB (preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CREDENTIALS_CHECK: "1"
          EXPO_PUBLIC_ADMOB_TEST_MODE: "true"
          EXPO_PUBLIC_REWARDED_AD_MOCK: "false"
        run: eas build --platform android --profile preview --local --non-interactive --output ./build-preview.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: wwht-preview-aab
          path: build-preview.aab
          retention-days: 14
